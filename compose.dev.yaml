# Development database. Not for production: see the self-hosting guide (Sprint 7).
#
#   docker compose -f compose.dev.yaml up -d
#   export TEST_DATABASE_URL=postgres://passguardian:passguardian@localhost:5432/passguardian_test
#   export DATABASE_URL=postgres://passguardian:passguardian@localhost:5432/passguardian
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: passguardian
      POSTGRES_PASSWORD: passguardian
      POSTGRES_DB: passguardian
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passguardian"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
