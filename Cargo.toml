[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/proto",
    "crates/server-domain",
    "crates/server-data",
    "crates/server-api",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/mahakaal/passguardian"
authors = ["PassGuardian contributors"]

[workspace.dependencies]
# Internal
passguardian-core = { path = "crates/core" }
passguardian-proto = { path = "crates/proto" }
passguardian-server-domain = { path = "crates/server-domain" }
passguardian-server-data = { path = "crates/server-data" }
passguardian-server-api = { path = "crates/server-api" }

# External
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
